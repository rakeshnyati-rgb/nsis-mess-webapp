<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <title>NSIS Mess Management</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #202124;
    }

    .header {
      background: white;
      text-align: center;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
    }

    .container {
      max-width: 500px;
      margin: 18px auto;
      padding: 14px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,.09);
    }

    .title {
      text-align: center;
      margin-bottom: 20px;
    }

    .title h2 {
      margin: 0 0 8px;
    }

    .title p {
      margin: 0;
      color: #5f6368;
    }

    .backend {
      margin: 10px 0 15px;
      padding: 9px;
      border-radius: 9px;
      text-align: center;
      font-size: 13px;
      font-weight: bold;
      background: #fff3cd;
      color: #795500;
    }

    .backend.ready {
      background: #e6f4ea;
      color: #137333;
    }

    #reader {
      width: 100%;
      margin-top: 12px;
      overflow: hidden;
      border-radius: 14px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      font-size: 17px;
      font-weight: bold;
      border-radius: 11px;
      cursor: pointer;
    }

    .startBtn {
      background: #1a73e8;
      color: white;
      border: 0;
    }

    .stopBtn {
      background: white;
      color: #333;
      border: 1px solid #ccc;
    }

    #result {
      margin-top: 18px;
    }

    .resultCard {
      padding: 22px;
      border-radius: 16px;
      text-align: center;
    }

    .studentPhoto {
      width: 135px;
      height: 135px;
      object-fit: cover;
      border-radius: 16px;
      border: 4px solid white;
      box-shadow: 0 3px 12px rgba(0,0,0,.18);
      display: block;
      margin: 0 auto 14px;
    }

    .placeholder {
      width: 135px;
      height: 135px;
      border-radius: 16px;
      background: #eef1f5;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 50px;
      margin: 0 auto 14px;
    }

    .studentName {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .statusIcon {
      font-size: 40px;
      margin-top: 14px;
    }

    .statusText {
      font-size: 25px;
      font-weight: bold;
      margin-top: 6px;
    }

    #backendFrame {
      display: none;
      width: 1px;
      height: 1px;
      border: 0;
    }

    @media (max-width: 600px) {
      .container {
        padding: 10px;
        margin-top: 8px;
      }

      .card {
        padding: 16px;
      }
    }
  </style>
</head>

<body>

<div class="header">
  <h1>NSIS Mess Management</h1>
</div>

<div class="container">

  <div class="card">

    <div class="title">
      <h2>🍽️ Live Mess QR Entry</h2>
      <p>Scan Student QR Code</p>
    </div>

    <div id="backendStatus" class="backend">
      Connecting to Mess System...
    </div>

    <button
      id="startButton"
      class="startBtn"
      onclick="startScanner()"
      disabled
    >
      📷 Start Camera
    </button>

    <div id="reader"></div>

    <button
      class="stopBtn"
      onclick="stopScanner()"
    >
      Stop Camera
    </button>

    <div id="result"></div>

  </div>

</div>


<!-- Hidden Apps Script Backend Bridge -->
<iframe
  id="backendFrame"
  src="https://script.google.com/macros/s/AKfycbyEwKZwMwd0m3glz0gI10aaJWJt7UOU2Wf7I5S0cCor2kKo3FQDEInPW1LapZcQq8sS/exec?mode=bridge"
></iframe>


<script>

let html5QrCode = null;
let scannerRunning = false;
let scanLocked = false;
let backendReady = false;

const pendingRequests = new Map();


/* ==========================================
   BACKEND COMMUNICATION
========================================== */

window.addEventListener(
  'message',
  function(event) {

    let validOrigin = false;

    try {
      const host = new URL(event.origin).hostname;

      validOrigin =
        host === 'script.google.com' ||
        host === 'script.googleusercontent.com' ||
        host.endsWith('.googleusercontent.com');

    } catch (e) {}

    if (!validOrigin) {
      return;
    }


    const message = event.data || {};


    if (message.type === 'BRIDGE_READY') {

      backendReady = true;

      const status =
        document.getElementById('backendStatus');

      status.textContent =
        '✅ Mess System Connected';

      status.classList.add('ready');

      document
        .getElementById('startButton')
        .disabled = false;

      return;
    }


    if (
      message.type === 'MEAL_RESULT' &&
      pendingRequests.has(message.requestId)
    ) {

      const handlers =
        pendingRequests.get(
          message.requestId
        );

      pendingRequests.delete(
        message.requestId
      );

      handlers.resolve(
        message.result
      );

      return;
    }


    if (
      message.type === 'MEAL_ERROR' &&
      pendingRequests.has(message.requestId)
    ) {

      const handlers =
        pendingRequests.get(
          message.requestId
        );

      pendingRequests.delete(
        message.requestId
      );

      handlers.reject(
        new Error(
          message.message ||
          'Backend error'
        )
      );
    }

  }
);


function recordMealOnServer(qr) {

  return new Promise(
    function(resolve, reject) {

      if (!backendReady) {

        reject(
          new Error(
            'Mess backend is not connected'
          )
        );

        return;
      }


      const requestId =
        'REQ_' +
        Date.now() +
        '_' +
        Math.random()
          .toString(36)
          .substring(2, 8);


      pendingRequests.set(
        requestId,
        {
          resolve: resolve,
          reject: reject
        }
      );


      const frame =
        document.getElementById(
          'backendFrame'
        );


      frame.contentWindow.postMessage(
        {
          type: 'RECORD_MEAL',
          requestId: requestId,
          qr: qr
        },
        '*'
      );


      setTimeout(
        function() {

          if (
            pendingRequests.has(
              requestId
            )
          ) {

            pendingRequests.delete(
              requestId
            );

            reject(
              new Error(
                'Server response timeout'
              )
            );
          }

        },
        20000
      );

    }
  );
}


/* ==========================================
   START LIVE CAMERA
========================================== */

async function startScanner() {

  if (scannerRunning) {
    return;
  }


  if (!backendReady) {

    showError(
      'Mess System is still connecting.'
    );

    return;
  }


  document
    .getElementById('result')
    .innerHTML = '';


  try {

    html5QrCode =
      new Html5Qrcode('reader');


    const cameras =
      await Html5Qrcode.getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        'No camera found'
      );
    }


    let cameraId =
      cameras[0].id;


    for (
      let i = 0;
      i < cameras.length;
      i++
    ) {

      const label =
        String(
          cameras[i].label || ''
        ).toLowerCase();


      if (
        label.includes('back') ||
        label.includes('rear') ||
        label.includes('environment')
      ) {

        cameraId =
          cameras[i].id;

        break;
      }
    }


    const config = {

      fps: 12,

      qrbox: function(
        width,
        height
      ) {

        const size =
          Math.floor(
            Math.min(
              width,
              height
            ) * 0.70
          );


        return {
          width: size,
          height: size
        };
      }

    };


    await html5QrCode.start(

      cameraId,

      config,

      onQrDetected,

      function() {
        // Normal failed frames ignored
      }

    );


    scannerRunning = true;

  }

  catch (error) {

    showError(
      'Camera Error: ' +
      (
        error.message ||
        error
      )
    );

  }
}


/* ==========================================
   QR DETECTED
========================================== */

async function onQrDetected(
  decodedText
) {

  if (scanLocked) {
    return;
  }


  const qr =
    String(
      decodedText || ''
    )
      .trim()
      .toUpperCase();


  if (!qr) {
    return;
  }


  scanLocked = true;


  await stopScanner();


  document
    .getElementById('result')
    .innerHTML =

    '<div style="' +
      'padding:20px;' +
      'text-align:center;' +
      'font-weight:bold;' +
    '">' +

      'Checking student...' +

    '</div>';


  try {

    const data =
      await recordMealOnServer(qr);


    showMealResult(data);

  }

  catch (error) {

    showError(
      error.message ||
      'Unable to record meal'
    );

  }


  setTimeout(
    function() {

      scanLocked = false;

    },
    1500
  );
}


/* ==========================================
   STOP CAMERA
========================================== */

async function stopScanner() {

  try {

    if (
      html5QrCode &&
      scannerRunning
    ) {

      await html5QrCode.stop();

    }


    if (html5QrCode) {

      html5QrCode.clear();

    }

  }

  catch (error) {

    console.log(
      'Stop camera:',
      error
    );

  }


  html5QrCode = null;

  scannerRunning = false;
}


/* ==========================================
   DISPLAY RESULT
========================================== */

function showMealResult(data) {

  if (!data) {

    showError(
      'No response received'
    );

    return;
  }


  if (data.status === 'ERROR') {

    showError(
      data.message ||
      'System error'
    );

    return;
  }


  if (data.status === 'UNKNOWN QR') {

    document
      .getElementById('result')
      .innerHTML =

      '<div class="resultCard" ' +
        'style="background:#fdecea;color:#b3261e;">' +

        '<div class="statusIcon">🔴</div>' +

        '<div class="statusText">' +
          'UNKNOWN QR' +
        '</div>' +

        '<div style="margin-top:8px;">' +
          'Student not found' +
        '</div>' +

      '</div>';


    scheduleNextScan();

    return;
  }


  const student =
    data.student || {};


  let bg =
    '#e6f4ea';

  let color =
    '#137333';

  let icon =
    '🟢';

  let title =
    'MEAL ALLOWED';


  if (
    data.status ===
    'ALREADY TAKEN'
  ) {

    bg = '#fff4e5';
    color = '#b06000';
    icon = '🟠';
    title = 'ALREADY TAKEN';

  }


  else if (
    data.status ===
    'MESS NOT ACTIVE'
  ) {

    bg = '#fdecea';
    color = '#b3261e';
    icon = '🔴';
    title = 'MESS NOT ACTIVE';

  }


  else if (
    data.status ===
    'MESS STOPPED'
  ) {

    bg = '#fdecea';
    color = '#b3261e';
    icon = '🔴';
    title = 'MESS STOPPED';

  }


  else if (
    data.status ===
    'NOT STARTED'
  ) {

    bg = '#fdecea';
    color = '#b3261e';
    icon = '🔴';
    title = 'MESS NOT STARTED';

  }


  let photoHtml = '';


  if (
    student.photoUrl &&
    student.photoUrl.length > 100
  ) {

    photoHtml =

      '<img ' +
        'class="studentPhoto" ' +
        'src="' +
          student.photoUrl +
        '" ' +
        'alt="Student Photo"' +
      '>';

  }

  else {

    photoHtml =

      '<div class="placeholder">' +
        '👤' +
      '</div>';

  }


  document
    .getElementById('result')
    .innerHTML =

    '<div class="resultCard" ' +

      'style="' +
        'background:' +
        bg +
        ';' +
      '"' +

    '>' +

      photoHtml +

      '<div class="studentName">' +
        escapeHtml(
          student.name || ''
        ) +
      '</div>' +

      '<div>' +
        'Student ID: <strong>' +
        escapeHtml(
          student.id || ''
        ) +
        '</strong>' +
      '</div>' +

      '<div style="margin-top:4px;">' +
        'Class: <strong>' +
        escapeHtml(
          student.className || ''
        ) +
        '</strong>' +
      '</div>' +

      '<div class="statusIcon">' +
        icon +
      '</div>' +

      '<div class="statusText" ' +
        'style="color:' +
        color +
        ';">' +

        title +

      '</div>' +

    '</div>';


  scheduleNextScan();
}


/* ==========================================
   AUTOMATIC NEXT CHILD
========================================== */

function scheduleNextScan() {

  setTimeout(
    function() {

      document
        .getElementById('result')
        .innerHTML = '';


      if (
        backendReady &&
        !scannerRunning
      ) {

        startScanner();

      }

    },
    2500
  );
}


/* ==========================================
   ERROR
========================================== */

function showError(message) {

  document
    .getElementById('result')
    .innerHTML =

    '<div class="resultCard" ' +
      'style="' +
        'background:#fdecea;' +
        'color:#b3261e;' +
      '">' +

      '🔴 ' +
      escapeHtml(message) +

    '</div>';
}


/* ==========================================
   SAFE TEXT
========================================== */

function escapeHtml(value) {

  return String(value)

    .replaceAll(
      '&',
      '&amp;'
    )

    .replaceAll(
      '<',
      '&lt;'
    )

    .replaceAll(
      '>',
      '&gt;'
    )

    .replaceAll(
      '"',
      '&quot;'
    )

    .replaceAll(
      "'",
      '&#039;'
    );
}

</script>

</body>
</html>
