<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <title>NSIS Mess Management</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #202124;
    }

    .header {
      background: #ffffff;
      padding: 18px;
      text-align: center;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
    }

    .container {
      max-width: 500px;
      margin: 18px auto;
      padding: 12px;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,.09);
    }

    .center {
      text-align: center;
    }

    .subtitle {
      color: #666;
      margin-top: 5px;
    }

    .backend {
      margin: 15px 0;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      background: #fff3cd;
      color: #795500;
    }

    .backend.ready {
      background: #e6f4ea;
      color: #137333;
    }

    .formGroup {
      margin-top: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccd0d5;
      border-radius: 10px;
      font-size: 17px;
      outline: none;
    }

    input:focus {
      border-color: #1a73e8;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      border: 0;
      background: #1a73e8;
      color: white;
    }

    .primary:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .secondary {
      border: 1px solid #ccc;
      background: #ffffff;
      color: #333;
    }

    .danger {
      border: 1px solid #d93025;
      background: #ffffff;
      color: #d93025;
    }

    .error {
      background: #fdecea;
      color: #b3261e;
      border-radius: 10px;
      padding: 11px;
      margin-top: 14px;
      text-align: center;
      font-weight: bold;
    }

    .staffBar {
      background: #eef3fd;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 15px;
    }

    .staffName {
      font-weight: bold;
      font-size: 17px;
    }

    .staffRole {
      color: #555;
      font-size: 13px;
      margin-top: 3px;
    }

    #reader {
      width: 100%;
      margin-top: 12px;
      overflow: hidden;
      border-radius: 14px;
    }

    #result {
      margin-top: 18px;
    }

    .resultCard {
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }

    .studentPhoto {
      width: 135px;
      height: 135px;
      object-fit: cover;
      border-radius: 16px;
      display: block;
      margin: 0 auto 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,.18);
    }

    .placeholder {
      width: 135px;
      height: 135px;
      border-radius: 16px;
      margin: 0 auto 14px;
      background: #eef1f5;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 50px;
    }

    .studentName {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .statusIcon {
      font-size: 42px;
      margin-top: 15px;
    }

    .statusText {
      font-size: 24px;
      font-weight: bold;
      margin-top: 6px;
    }

    #scannerScreen {
      display: none;
    }

    #backendFrame {
      display: none;
      width: 1px;
      height: 1px;
      border: 0;
    }
  </style>
</head>

<body>

<div class="header">
  <h1>NSIS Mess Management</h1>
</div>

<div class="container">

  <!-- LOGIN SCREEN -->
  <div
    id="loginScreen"
    class="card"
  >

    <div class="center">
      <h2>🔐 Staff Login</h2>

      <div class="subtitle">
        Mess Entry System
      </div>
    </div>

    <div
      id="backendStatus"
      class="backend"
    >
      Connecting to Mess System...
    </div>

    <div class="formGroup">
      <label>Login ID</label>

      <input
        id="loginId"
        type="text"
        placeholder="Example: ADMIN01"
        autocomplete="username"
      >
    </div>

    <div class="formGroup">
      <label>6-Digit PIN</label>

      <input
        id="loginPin"
        type="password"
        inputmode="numeric"
        maxlength="6"
        placeholder="Enter PIN"
        autocomplete="current-password"
      >
    </div>

    <button
      id="loginButton"
      class="primary"
      onclick="loginStaff()"
      disabled
    >
      Login
    </button>

    <div id="loginMessage"></div>

  </div>


  <!-- SCANNER SCREEN -->
  <div
    id="scannerScreen"
    class="card"
  >

    <div class="staffBar">

      <div>
        Logged in as
      </div>

      <div
        id="staffName"
        class="staffName"
      ></div>

      <div
        id="staffRole"
        class="staffRole"
      ></div>

    </div>

    <div class="center">

      <h2 style="margin-bottom:5px;">
        🍽️ Live Mess QR Entry
      </h2>

      <div class="subtitle">
        Scan Student QR Code
      </div>

    </div>

    <button
      id="startButton"
      class="primary"
      onclick="startScanner()"
    >
      📷 Start Camera
    </button>

    <div id="reader"></div>

   <button
  id="manualEntryButton"
  class="secondary"
  onclick="openManualEntry()"
  style="display:none;"
>
  ✍️ Manual Entry
</button>


<div
  id="manualEntryBox"
  style="
    display:none;
    margin-top:15px;
    padding:15px;
    background:#f8f9fa;
    border-radius:12px;
    border:1px solid #ddd;
  "
>

  <h3 style="margin-top:0;">
    Manual Meal Entry
  </h3>

  <div class="formGroup">

    <label>Student ID</label>

    <input
      id="manualStudentId"
      type="text"
      placeholder="Example: STU0001"
    >

  </div>


  <div class="formGroup">

    <label>Reason</label>

    <select
      id="manualReason"
      style="
        width:100%;
        padding:14px;
        border:1px solid #ccd0d5;
        border-radius:10px;
        font-size:16px;
      "
    >

      <option value="">
        Select Reason
      </option>

      <option value="QR Card Not Available">
        QR Card Not Available
      </option>

      <option value="QR Card Damaged">
        QR Card Damaged
      </option>

      <option value="Camera / Scan Problem">
        Camera / Scan Problem
      </option>

      <option value="Other">
        Other
      </option>

    </select>

  </div>


  <button
    class="primary"
    onclick="submitManualEntry()"
  >
    Submit Manual Entry
  </button>


  <button
    class="secondary"
    onclick="closeManualEntry()"
  >
    Cancel
  </button>

</div>


<div id="result"></div>

    <button
      class="danger"
      onclick="logoutStaff()"
    >
      Logout
    </button>

  </div>

</div>


<iframe
  id="backendFrame"
  name="backendFrame"
  src="https://script.google.com/macros/s/AKfycbyEwKZwMwd0m3glz0gI10aaJWJt7UOU2Wf7I5S0cCor2kKo3FQDEInPW1LapZcQq8sS/exec?mode=bridge"
></iframe>


<form
  id="backendForm"
  method="POST"
  target="backendFrame"
  action="https://script.google.com/macros/s/AKfycbyEwKZwMwd0m3glz0gI10aaJWJt7UOU2Wf7I5S0cCor2kKo3FQDEInPW1LapZcQq8sS/exec"
  style="display:none;"
></form>


<script>

const BACKEND_URL =
  'https://script.google.com/macros/s/AKfycbyEwKZwMwd0m3glz0gI10aaJWJt7UOU2Wf7I5S0cCor2kKo3FQDEInPW1LapZcQq8sS/exec';

let backendReady = false;

let sessionToken =
  sessionStorage.getItem(
    'NSIS_MESS_TOKEN'
  ) || '';

let currentStaff = null;

try {

  currentStaff =
    JSON.parse(
      sessionStorage.getItem(
        'NSIS_MESS_STAFF'
      ) || 'null'
    );

}
catch (e) {

  currentStaff = null;

}

let html5QrCode = null;
let scannerRunning = false;
let scanLocked = false;

let currentRequestId = '';
let responseTimer = null;
let currentAction = '';


/* ==========================================
   BACKEND MESSAGES
========================================== */

window.addEventListener(
  'message',
  function(event) {

    let validOrigin = false;

    try {

      const host =
        new URL(
          event.origin
        ).hostname;

      validOrigin =
        host === 'script.google.com' ||
        host === 'script.googleusercontent.com' ||
        host.endsWith(
          '.googleusercontent.com'
        );

    }
    catch (e) {}


    if (!validOrigin) {
      return;
    }


    const message =
      event.data || {};


    /* BRIDGE READY */

    if (
      message.type ===
      'BRIDGE_READY'
    ) {

      backendReady = true;

      const backendStatus =
        document.getElementById(
          'backendStatus'
        );

      backendStatus.textContent =
        '✅ Mess System Connected';

      backendStatus.classList.add(
        'ready'
      );

      document.getElementById(
        'loginButton'
      ).disabled = false;


      if (
        sessionToken &&
        currentStaff
      ) {

        showScannerScreen();

      }

      return;
    }


    /* LOGIN RESULT */

    if (
      message.type ===
      'LOGIN_RESULT' &&
      message.requestId ===
        currentRequestId
    ) {

      finishRequest();

      const result =
        message.result || {};


      if (
        result.success === true &&
        result.token
      ) {

        sessionToken =
          result.token;

        currentStaff =
          result.staff || {};


        sessionStorage.setItem(
          'NSIS_MESS_TOKEN',
          sessionToken
        );

        sessionStorage.setItem(
          'NSIS_MESS_STAFF',
          JSON.stringify(
            currentStaff
          )
        );


        document.getElementById(
          'loginPin'
        ).value = '';

        document.getElementById(
          'loginMessage'
        ).innerHTML = '';


        showScannerScreen();

      }

      else {

        showLoginError(
          result.message ||
          'Invalid Login ID or PIN.'
        );

      }

      return;
    }


    /* SCAN RESULT */

    if (
      message.type ===
      'SCAN_RESULT' &&
      message.requestId ===
        currentRequestId
    ) {

      finishRequest();

      const result =
        message.result || {};


      if (
        result.authRequired === true
      ) {

        clearSession();

        showLoginScreen();

        showLoginError(
          'Session expired. Please login again.'
        );

        return;
      }


      if (
        result.success !== true
      ) {

        showError(
          result.message ||
          'Unable to record meal.'
        );

        scheduleNextScan();

        return;
      }


      showMealResult(
        result.meal
      );

      return;
    }
    /* MANUAL ENTRY RESULT */

    if (
      message.type ===
      'MANUAL_RESULT' &&
      message.requestId ===
        currentRequestId
    ) {

      finishRequest();

      const result =
        message.result || {};


      if (
        result.authRequired === true
      ) {

        clearSession();

        showLoginScreen();

        showLoginError(
          'Session expired. Please login again.'
        );

        return;
      }


      if (
        result.success !== true
      ) {

        showError(
          result.message ||
          'Manual entry failed.'
        );

        return;
      }


      closeManualEntry();

      showMealResult(
        result.meal
      );

      return;
    }

    /* LOGOUT RESULT */

    if (
      message.type ===
      'LOGOUT_RESULT' &&
      message.requestId ===
        currentRequestId
    ) {

      finishRequest();

      clearSession();

      showLoginScreen();

      return;
    }


    /* BACKEND ERROR */

    if (
      message.type ===
      'BACKEND_ERROR' &&
      message.requestId ===
        currentRequestId
    ) {

      finishRequest();

      if (
        currentAction === 'login'
      ) {

        showLoginError(
          message.message ||
          'Backend error.'
        );

      }

      else {

        showError(
          message.message ||
          'Backend error.'
        );

      }

    }

  }
);


/* ==========================================
   POST TO APPS SCRIPT
========================================== */

function postToBackend(
  action,
  fields
) {

  if (!backendReady) {

    if (action === 'login') {

      showLoginError(
        'Mess System is still connecting.'
      );

    }

    return;
  }


  currentRequestId =
    'REQ_' +
    Date.now() +
    '_' +
    Math.random()
      .toString(36)
      .substring(2,8);


  currentAction =
    action;


  const form =
    document.getElementById(
      'backendForm'
    );


  form.innerHTML = '';


  addFormField(
    form,
    'action',
    action
  );

  addFormField(
    form,
    'requestId',
    currentRequestId
  );


  Object.keys(
    fields || {}
  ).forEach(
    function(key) {

      addFormField(
        form,
        key,
        fields[key]
      );

    }
  );


  form.submit();


  responseTimer =
    setTimeout(
      function() {

        if (
          currentRequestId
        ) {

          const actionCopy =
            currentAction;

          finishRequest();


          if (
            actionCopy === 'login'
          ) {

            showLoginError(
              'Server response timeout.'
            );

          }

          else {

            showError(
              'Server response timeout.'
            );

          }

        }

      },
      20000
    );
}


function addFormField(
  form,
  name,
  value
) {

  const input =
    document.createElement(
      'input'
    );

  input.type =
    'hidden';

  input.name =
    name;

  input.value =
    String(
      value == null
        ? ''
        : value
    );

  form.appendChild(
    input
  );
}


function finishRequest() {

  clearTimeout(
    responseTimer
  );

  currentRequestId =
    '';

  currentAction =
    '';

}


/* ==========================================
   STAFF LOGIN
========================================== */

function loginStaff() {

  if (!backendReady) {
    return;
  }


  const loginId =
    document.getElementById(
      'loginId'
    )
      .value
      .trim()
      .toUpperCase();


  const pin =
    document.getElementById(
      'loginPin'
    )
      .value
      .trim();


  document.getElementById(
    'loginId'
  ).value =
    loginId;


  if (!loginId) {

    showLoginError(
      'Please enter Login ID.'
    );

    return;
  }


  if (
    !/^\d{6}$/.test(pin)
  ) {

    showLoginError(
      'Please enter valid 6-digit PIN.'
    );

    return;
  }


  document.getElementById(
    'loginMessage'
  ).innerHTML =

    '<div class="backend">' +
      'Checking Login...' +
    '</div>';


  postToBackend(
    'login',
    {
      loginId: loginId,
      pin: pin
    }
  );
}


/* ENTER KEY LOGIN */

document.getElementById(
  'loginPin'
).addEventListener(
  'keydown',
  function(event) {

    if (
      event.key === 'Enter'
    ) {

      loginStaff();

    }

  }
);


/* ==========================================
   SCREENS
========================================== */

function openManualEntry() {

  if (
    !currentStaff ||
    currentStaff.canManualEntry !== true
  ) {

    showError(
      'Manual Entry permission not allowed.'
    );

    return;
  }

  stopScanner();

  document.getElementById(
    'manualEntryBox'
  ).style.display = 'block';

  document.getElementById(
    'result'
  ).innerHTML = '';
}


function closeManualEntry() {

  document.getElementById(
    'manualEntryBox'
  ).style.display = 'none';

  document.getElementById(
    'manualStudentId'
  ).value = '';

  document.getElementById(
    'manualReason'
  ).value = '';
}


function submitManualEntry() {

  if (!sessionToken) {

    showLoginScreen();

    return;
  }


  if (
    !currentStaff ||
    currentStaff.canManualEntry !== true
  ) {

    showError(
      'Manual Entry permission not allowed.'
    );

    return;
  }


  const studentId =
    document.getElementById(
      'manualStudentId'
    )
      .value
      .trim()
      .toUpperCase();


  const manualReason =
    document.getElementById(
      'manualReason'
    )
      .value
      .trim();


  document.getElementById(
    'manualStudentId'
  ).value =
    studentId;


  if (!studentId) {

    showError(
      'Please enter Student ID.'
    );

    return;
  }


  if (!manualReason) {

    showError(
      'Please select Manual Entry reason.'
    );

    return;
  }


  document.getElementById(
    'result'
  ).innerHTML =

    '<div class="resultCard" ' +
    'style="background:#eef3fd;">' +

    '<strong>Student ID: ' +
    escapeHtml(studentId) +
    '</strong><br><br>' +

    'Checking Manual Entry...' +

    '</div>';


  postToBackend(
    'manual',
    {
      token: sessionToken,
      studentId: studentId,
      manualReason: manualReason
    }
  );
}


/* ==========================================
   SCREENS
========================================== */
  
function showScannerScreen() {

  if (
    !sessionToken ||
    !currentStaff
  ) {

    showLoginScreen();

    return;
  }


  document.getElementById(
    'loginScreen'
  ).style.display =
    'none';


  document.getElementById(
    'scannerScreen'
  ).style.display =
    'block';


  document.getElementById(
    'staffName'
  ).textContent =
    currentStaff.name ||
    currentStaff.loginId ||
    'Mess Staff';


  document.getElementById(
    'staffRole'
  ).textContent =
    currentStaff.role || '';

}

  const manualButton =
  document.getElementById(
    'manualEntryButton'
  );

if (
  currentStaff.canManualEntry === true ||
  String(currentStaff.role || '')
    .trim()
    .toUpperCase() === 'ADMIN'
) {
  manualButton.style.display =
    'block';
}
else {
  manualButton.style.display =
    'none';
}

function showLoginScreen() {

  stopScanner();


  document.getElementById(
    'scannerScreen'
  ).style.display =
    'none';


  document.getElementById(
    'loginScreen'
  ).style.display =
    'block';


  document.getElementById(
    'result'
  ).innerHTML = '';

}


/* ==========================================
   LOGOUT
========================================== */

async function logoutStaff() {

  await stopScanner();


  if (!sessionToken) {

    clearSession();

    showLoginScreen();

    return;
  }


  postToBackend(
    'logout',
    {
      token: sessionToken
    }
  );
}


function clearSession() {

  sessionToken = '';
  currentStaff = null;

  sessionStorage.removeItem(
    'NSIS_MESS_TOKEN'
  );

  sessionStorage.removeItem(
    'NSIS_MESS_STAFF'
  );

}


/* ==========================================
   START CAMERA
========================================== */

async function startScanner() {

  if (scannerRunning) {
    return;
  }


  if (!sessionToken) {

    showLoginScreen();

    return;
  }


  document.getElementById(
    'result'
  ).innerHTML = '';


  scanLocked = false;


  try {

    html5QrCode =
      new Html5Qrcode(
        'reader'
      );


    const cameras =
      await Html5Qrcode
        .getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        'No camera found'
      );
    }


    let cameraId =
      cameras[0].id;


    for (
      let i = 0;
      i < cameras.length;
      i++
    ) {

      const label =
        String(
          cameras[i].label || ''
        ).toLowerCase();


      if (
        label.includes('back') ||
        label.includes('rear') ||
        label.includes(
          'environment'
        )
      ) {

        cameraId =
          cameras[i].id;

        break;
      }
    }


    await html5QrCode.start(

      cameraId,

      {
        fps: 12,

        qrbox: function(
          width,
          height
        ) {

          const size =
            Math.floor(
              Math.min(
                width,
                height
              ) * .70
            );

          return {
            width: size,
            height: size
          };

        }
      },

      onQrDetected,

      function() {}

    );


    scannerRunning =
      true;

  }

  catch (error) {

    scannerRunning =
      false;

    html5QrCode =
      null;

    showError(
      'Camera Error: ' +
      (
        error.message ||
        error
      )
    );

  }
}


/* ==========================================
   QR DETECTED
========================================== */

async function onQrDetected(
  decodedText
) {

  if (scanLocked) {
    return;
  }


  const qr =
    String(
      decodedText || ''
    )
      .trim()
      .toUpperCase();


  if (!qr) {
    return;
  }


  scanLocked =
    true;


  await stopScanner();


  document.getElementById(
    'result'
  ).innerHTML =

    '<div class="resultCard" ' +
    'style="background:#eef3fd;">' +

    '<strong>QR: ' +
    escapeHtml(qr) +
    '</strong><br><br>' +

    'Checking Student...' +

    '</div>';


  postToBackend(
    'scan',
    {
      token:
        sessionToken,

      qr:
        qr
    }
  );
}


/* ==========================================
   STOP CAMERA
========================================== */

async function stopScanner() {

  try {

    if (
      html5QrCode &&
      scannerRunning
    ) {

      await html5QrCode.stop();

    }


    if (html5QrCode) {

      try {
        html5QrCode.clear();
      }
      catch (e) {}

    }

  }

  catch (error) {

    console.log(
      'Camera stop:',
      error
    );

  }


  html5QrCode =
    null;

  scannerRunning =
    false;
}


/* ==========================================
   DISPLAY MEAL RESULT
========================================== */

function showMealResult(data) {

  if (!data) {

    showError(
      'No response received.'
    );

    scheduleNextScan();

    return;
  }


  const status =
    String(
      data.status ||
      data.scanStatus ||
      ''
    )
      .trim()
      .toUpperCase();


  const student =
    data.student || {};


  let background =
    '#e6f4ea';

  let textColor =
    '#137333';

  let icon =
    '🟢';

  let title =
    status ||
    'ALLOWED';


  if (
    status === 'ALLOWED'
  ) {

    title =
      'MEAL ALLOWED';

  }


  else if (
    status ===
    'ALREADY TAKEN'
  ) {

    background =
      '#fff4e5';

    textColor =
      '#b06000';

    icon =
      '🟠';

    title =
      'ALREADY TAKEN';

  }


  else if (
    status ===
    'MESS NOT ACTIVE'
  ) {

    background =
      '#fdecea';

    textColor =
      '#b3261e';

    icon =
      '🔴';

    title =
      'MESS NOT ACTIVE';

  }


  else if (
    status ===
    'MESS STOPPED'
  ) {

    background =
      '#fdecea';

    textColor =
      '#b3261e';

    icon =
      '🔴';

    title =
      'MESS STOPPED';

  }


  else if (
    status === 'NOT STARTED' ||
    status ===
    'MESS NOT STARTED'
  ) {

    background =
      '#fdecea';

    textColor =
      '#b3261e';

    icon =
      '🔴';

    title =
      'MESS NOT STARTED';

  }


  else if (
    status === 'UNKNOWN QR' ||
    status ===
    'STUDENT NOT FOUND'
  ) {

    background =
      '#fdecea';

    textColor =
      '#b3261e';

    icon =
      '🔴';

    title =
      'STUDENT NOT FOUND';

  }


  else if (
    status === 'ERROR'
  ) {

    background =
      '#fdecea';

    textColor =
      '#b3261e';

    icon =
      '🔴';

    title =
      data.message ||
      'SYSTEM ERROR';

  }


  let photoHtml = '';


  if (
    student.photoUrl &&
    String(
      student.photoUrl
    ).length > 100
  ) {

    photoHtml =

      '<img ' +
      'class="studentPhoto" ' +
      'src="' +
      student.photoUrl +
      '" ' +
      'alt="Student Photo">';

  }

  else {

    photoHtml =

      '<div class="placeholder">' +
      '👤' +
      '</div>';

  }


  document.getElementById(
    'result'
  ).innerHTML =

    '<div class="resultCard" ' +
    'style="background:' +
    background +
    ';">' +

    photoHtml +

    '<div class="studentName">' +
    escapeHtml(
      student.name || ''
    ) +
    '</div>' +

    '<div>' +
    'Student ID: <strong>' +
    escapeHtml(
      student.id || ''
    ) +
    '</strong>' +
    '</div>' +

    '<div style="margin-top:5px;">' +
    'Class: <strong>' +
    escapeHtml(
      student.className || ''
    ) +
    '</strong>' +
    '</div>' +

    '<div class="statusIcon">' +
    icon +
    '</div>' +

    '<div class="statusText" ' +
    'style="color:' +
    textColor +
    ';">' +

    escapeHtml(title) +

    '</div>' +

    '</div>';


  scheduleNextScan();
}


/* ==========================================
   NEXT STUDENT
========================================== */

function scheduleNextScan() {

  setTimeout(
    function() {

      scanLocked =
        false;


      document.getElementById(
        'result'
      ).innerHTML = '';


      if (
        sessionToken &&
        !scannerRunning
      ) {

        startScanner();

      }

    },
    3000
  );
}


/* ==========================================
   MESSAGES
========================================== */

function showLoginError(
  message
) {

  document.getElementById(
    'loginMessage'
  ).innerHTML =

    '<div class="error">' +
    escapeHtml(message) +
    '</div>';
}


function showError(
  message
) {

  document.getElementById(
    'result'
  ).innerHTML =

    '<div class="error">' +
    '🔴 ' +
    escapeHtml(message) +
    '</div>';
}


/* ==========================================
   SAFE TEXT
========================================== */

function escapeHtml(
  value
) {

  return String(value)

    .replaceAll(
      '&',
      '&amp;'
    )

    .replaceAll(
      '<',
      '&lt;'
    )

    .replaceAll(
      '>',
      '&gt;'
    )

    .replaceAll(
      '"',
      '&quot;'
    )

    .replaceAll(
      "'",
      '&#039;'
    );
}
