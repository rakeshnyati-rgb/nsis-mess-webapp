<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <title>NSIS Mess Management</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #202124;
    }

    .header {
      background: #ffffff;
      text-align: center;
      padding: 18px 10px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
    }

    .container {
      max-width: 500px;
      margin: 16px auto;
      padding: 12px;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,.09);
    }

    .title {
      text-align: center;
    }

    .title h2 {
      margin: 0 0 7px;
      font-size: 21px;
    }

    .title p {
      margin: 0;
      color: #666;
    }

    #backendStatus {
      margin: 16px 0;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      font-size: 14px;
      background: #fff3cd;
      color: #795500;
    }

    #backendStatus.ready {
      background: #e6f4ea;
      color: #137333;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 14px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border-radius: 11px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #startButton {
      border: 0;
      background: #1a73e8;
      color: white;
    }

    #startButton:disabled {
      opacity: .5;
    }

    #stopButton {
      background: white;
      border: 1px solid #ccc;
    }

    #result {
      margin-top: 18px;
    }

    .resultCard {
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }

    .studentPhoto {
      width: 135px;
      height: 135px;
      object-fit: cover;
      border-radius: 16px;
      display: block;
      margin: 0 auto 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,.18);
    }

    .placeholder {
      width: 135px;
      height: 135px;
      border-radius: 16px;
      margin: 0 auto 14px;
      background: #eef1f5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
    }

    .studentName {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .statusIcon {
      font-size: 42px;
      margin-top: 15px;
    }

    .statusText {
      font-size: 24px;
      font-weight: bold;
      margin-top: 5px;
    }

    #backendFrame {
      display: none;
      width: 1px;
      height: 1px;
      border: 0;
    }
  </style>
</head>

<body>

<div class="header">
  <h1>NSIS Mess Management</h1>
</div>

<div class="container">
  <div class="card">

    <div class="title">
      <h2>🍽️ Live Mess QR Entry</h2>
      <p>Scan Student QR Code</p>
    </div>

    <div id="backendStatus">
      Connecting to Mess System...
    </div>

    <button
      id="startButton"
      onclick="startScanner()"
      disabled
    >
      📷 Start Camera
    </button>

    <div id="reader"></div>

    <button
      id="stopButton"
      onclick="stopScanner()"
    >
      Stop Camera
    </button>

    <div id="result"></div>

  </div>
</div>

<iframe
  id="backendFrame"
  src="https://script.google.com/macros/s/AKfycbyEwKZwMwd0m3glz0gI10aaJWJt7UOU2Wf7I5S0cCor2kKo3FQDEInPW1LapZcQq8sS/exec?mode=bridge"
></iframe>


<script>

const BACKEND_URL =
  'https://script.google.com/macros/s/AKfycbyEwKZwMwd0m3glz0gI10aaJWJt7UOU2Wf7I5S0cCor2kKo3FQDEInPW1LapZcQq8sS/exec';

let html5QrCode = null;
let scannerRunning = false;
let scanLocked = false;
let backendReady = false;
let currentRequestId = '';

let responseTimer = null;


/* =========================================
   RECEIVE MESSAGE FROM APPS SCRIPT
========================================= */

window.addEventListener('message', function(event) {

  let validGoogleOrigin = false;

  try {

    const hostname =
      new URL(event.origin).hostname;

    validGoogleOrigin =
      hostname === 'script.google.com' ||
      hostname === 'script.googleusercontent.com' ||
      hostname.endsWith('.googleusercontent.com');

  } catch (e) {}

  if (!validGoogleOrigin) {
    return;
  }


  const message =
    event.data || {};


  if (message.type === 'BRIDGE_READY') {

    backendReady = true;

    const status =
      document.getElementById('backendStatus');

    status.textContent =
      '✅ Mess System Connected';

    status.classList.add('ready');

    document.getElementById(
      'startButton'
    ).disabled = false;

    return;
  }


  if (
    message.type === 'MEAL_RESULT' &&
    message.requestId === currentRequestId
  ) {

    clearTimeout(responseTimer);

    currentRequestId = '';

    showMealResult(
      message.result
    );

    return;
  }


  if (
    message.type === 'MEAL_ERROR' &&
    message.requestId === currentRequestId
  ) {

    clearTimeout(responseTimer);

    currentRequestId = '';

    showError(
      message.message ||
      'Backend error'
    );

    scheduleNextScan();

  }

});


/* =========================================
   SEND QR TO APPS SCRIPT
========================================= */

function sendQrToBackend(qr) {

  currentRequestId =
    'REQ_' +
    Date.now() +
    '_' +
    Math.random()
      .toString(36)
      .substring(2,8);


  const url =
    BACKEND_URL +
    '?mode=bridge' +
    '&requestId=' +
    encodeURIComponent(
      currentRequestId
    ) +
    '&qr=' +
    encodeURIComponent(qr) +
    '&t=' +
    Date.now();


  document.getElementById(
    'backendFrame'
  ).src = url;


  responseTimer =
    setTimeout(
      function() {

        if (currentRequestId) {

          currentRequestId = '';

          showError(
            'Server response timeout'
          );

          scheduleNextScan();

        }

      },
      20000
    );
}


/* =========================================
   START CAMERA
========================================= */

async function startScanner() {

  if (scannerRunning) {
    return;
  }

  if (!backendReady) {

    showError(
      'Mess System is not connected.'
    );

    return;
  }


  document.getElementById(
    'result'
  ).innerHTML = '';


  scanLocked = false;


  try {

    html5QrCode =
      new Html5Qrcode('reader');


    const cameras =
      await Html5Qrcode.getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        'No camera found'
      );
    }


    let cameraId =
      cameras[0].id;


    for (
      let i = 0;
      i < cameras.length;
      i++
    ) {

      const label =
        String(
          cameras[i].label || ''
        ).toLowerCase();


      if (
        label.includes('back') ||
        label.includes('rear') ||
        label.includes('environment')
      ) {

        cameraId =
          cameras[i].id;

        break;
      }
    }


    const config = {

      fps: 12,

      qrbox: function(
        width,
        height
      ) {

        const size =
          Math.floor(
            Math.min(
              width,
              height
            ) * 0.70
          );

        return {
          width: size,
          height: size
        };
      }

    };


    await html5QrCode.start(

      cameraId,

      config,

      onQrDetected,

      function() {
        // Ignore normal scan failures
      }

    );


    scannerRunning = true;

  }

  catch (error) {

    scannerRunning = false;

    html5QrCode = null;

    showError(
      'Camera Error: ' +
      (
        error.message ||
        error
      )
    );

  }
}


/* =========================================
   QR DETECTED
========================================= */

async function onQrDetected(
  decodedText
) {

  if (scanLocked) {
    return;
  }


  const qr =
    String(
      decodedText || ''
    )
      .trim()
      .toUpperCase();


  if (!qr) {
    return;
  }


  scanLocked = true;


  await stopScanner();


  document.getElementById(
    'result'
  ).innerHTML =

    '<div class="resultCard" ' +
    'style="background:#eef3fd;">' +

    '<strong>QR: ' +
    escapeHtml(qr) +
    '</strong><br><br>' +

    'Checking student...' +

    '</div>';


  sendQrToBackend(qr);
}


/* =========================================
   STOP CAMERA
========================================= */

async function stopScanner() {

  try {

    if (
      html5QrCode &&
      scannerRunning
    ) {

      await html5QrCode.stop();

    }

    if (html5QrCode) {

      try {
        html5QrCode.clear();
      } catch (e) {}

    }

  }

  catch (error) {

    console.log(
      'Camera stop:',
      error
    );

  }


  html5QrCode = null;
  scannerRunning = false;
}


/* =========================================
   DISPLAY SERVER RESULT
========================================= */

function showMealResult(data) {

  if (!data) {

    showError(
      'No response received.'
    );

    scheduleNextScan();

    return;
  }


  const status =
    String(
      data.status ||
      data.scanStatus ||
      ''
    )
      .trim()
      .toUpperCase();


  const student =
    data.student || {};


  let background =
    '#e6f4ea';

  let textColor =
    '#137333';

  let icon =
    '🟢';

  let title =
    status || 'ALLOWED';


  if (status === 'ALLOWED') {

    title =
      'MEAL ALLOWED';

  }

  else if (
    status === 'ALREADY TAKEN'
  ) {

    background =
      '#fff4e5';

    textColor =
      '#b06000';

    icon =
      '🟠';

    title =
      'ALREADY TAKEN';

  }

  else if (
    status === 'MESS NOT ACTIVE'
  ) {

    background =
      '#fdecea';

    textColor =
      '#b3261e';

    icon =
      '🔴';

    title =
      'MESS NOT ACTIVE';

  }

  else if (
    status === 'MESS STOPPED'
  ) {

    background =
      '#fdecea';

    textColor =
      '#b3261e';

    icon =
      '🔴';

    title =
      'MESS STOPPED';

  }

  else if (
    status === 'NOT STARTED' ||
    status === 'MESS NOT STARTED'
  ) {

    background =
      '#fdecea';

    textColor =
      '#b3261e';

    icon =
      '🔴';

    title =
      'MESS NOT STARTED';

  }

  else if (
    status === 'UNKNOWN QR' ||
    status === 'STUDENT NOT FOUND'
  ) {

    background =
      '#fdecea';

    textColor =
      '#b3261e';

    icon =
      '🔴';

    title =
      'STUDENT NOT FOUND';

  }

  else if (
    status === 'ERROR'
  ) {

    background =
      '#fdecea';

    textColor =
      '#b3261e';

    icon =
      '🔴';

    title =
      data.message ||
      'SYSTEM ERROR';

  }


  let photoHtml = '';


  if (
    student.photoUrl &&
    String(
      student.photoUrl
    ).length > 100
  ) {

    photoHtml =
      '<img ' +
      'class="studentPhoto" ' +
      'src="' +
      student.photoUrl +
      '" ' +
      'alt="Student Photo">';

  }

  else {

    photoHtml =
      '<div class="placeholder">' +
      '👤' +
      '</div>';

  }


  document.getElementById(
    'result'
  ).innerHTML =

    '<div class="resultCard" ' +
    'style="background:' +
    background +
    ';">' +

    photoHtml +

    '<div class="studentName">' +
    escapeHtml(
      student.name || ''
    ) +
    '</div>' +

    '<div>' +
    'Student ID: <strong>' +
    escapeHtml(
      student.id || ''
    ) +
    '</strong>' +
    '</div>' +

    '<div style="margin-top:5px;">' +
    'Class: <strong>' +
    escapeHtml(
      student.className || ''
    ) +
    '</strong>' +
    '</div>' +

    '<div class="statusIcon">' +
    icon +
    '</div>' +

    '<div class="statusText" ' +
    'style="color:' +
    textColor +
    ';">' +

    escapeHtml(title) +

    '</div>' +

    '</div>';


  scheduleNextScan();
}


/* =========================================
   AUTO START NEXT SCAN
========================================= */

function scheduleNextScan() {

  setTimeout(
    function() {

      scanLocked = false;

      document.getElementById(
        'result'
      ).innerHTML = '';


      if (
        backendReady &&
        !scannerRunning
      ) {

        startScanner();

      }

    },
    3000
  );
}


/* =========================================
   ERROR DISPLAY
========================================= */

function showError(message) {

  document.getElementById(
    'result'
  ).innerHTML =

    '<div class="resultCard" ' +
    'style="' +
    'background:#fdecea;' +
    'color:#b3261e;' +
    '">' +

    '🔴 ' +
    escapeHtml(message) +

    '</div>';
}


/* =========================================
   SAFE HTML
========================================= */

function escapeHtml(value) {

  return String(value)

    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

</script>

</body>
</html>
